<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/4bb32e28ab.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- Side Bar -->
    <div class="sidebar_column">

        <!-- Siderbar Header -->
        <div class="sidebar_header">
            <div class="sidebar_header_logo">ChatGPT</div>
            <div class="sidebar_header_right">
                <a href="#"><i class="fa-solid fa-magnifying-glass sidebar_logo"></i></a>
                <a href="#"><i class="fa-solid fa-angle-right sidebar_logo "></i></a>
            </div>
        </div>

        <!-- Sidebar Links -->
        <div class="sidebar_content">
            <a href="#">
                <div class="sidebar_link" id="initial">
                    <i class="fa-regular fa-pen-to-square logo"></i>
                    New chat
                </div>
            </a>

            <a href="#">
                <div class="sidebar_link">
                    <i class="fa-regular fa-clock logo"></i>
                    Schedule
                </div>
            </a>

            <a href="#">
                <div class="sidebar_link">
                    <i class="fa-solid fa-book-open logo"></i>
                    Library
                </div>
            </a>

            <a href="#">
                <div class="sidebar_link">
                    <i class="fa-solid fa-plug logo"></i>
                    Plugins
                </div>
            </a>

            <a href="#">
                <div class="sidebar_link">
                    <i class="fa-solid fa-ellipsis logo"></i>
                    Explore
                </div>
            </a>
        </div>

        <!-- Sidebar Footers -->
        <div class="sidebar_footer">
            <a href="#">
                <div class="sidebar_account">
                    <div class="account_logo">AG</div>

                    <div class="account_details">
                        Aradhy
                        <span>
                            <p>Free</p>
                        </span>
                    </div>
                </div>
            </a>

            <a href="#">
                <div class="sidebar_footer_offer">
                    <i class="fa-solid fa-gift "></i>
                    Claim Offer
                </div>
            </a>
        </div>
    </div>


    <!-- Main Container -->
    <div class="main">

        <!-- Main Header -->
        <div class="main_header">
            <div class="header_middle">
                <div class="header_middle_element" id="selected">
                    <a href="#">Chat</a>
                </div>
                <div class="header_middle_element">
                    <a href="#">+ Work</a>
                </div>
            </div>


            <div class="header_right">
                <div class="header_offer">
                    <a href="#">
                        <i class="fa-solid fa-gift logo header_logo"></i>
                        Free offer
                    </a>
                </div>

                <div class="temporarychat">
                    <a href="#"><i class="fa-regular fa-comment logo"></i></a>
                </div>

            </div>

        </div>

        <!-- Main Body -->
        <div class="main_body">
            <!-- Heading -->
            <div class="main_heading">Ready when you are.</div>
            <!-- Search bar -->
            <div class="main_search_bar">

                <div class="search_bar_left">
                    <button>
                        <i class="fa-solid fa-plus logo hovering" id="plus"></i>
                    </button>
                    <input id="prompt" type="text" multiple placeholder="Ask ChatGPT">
                </div>

                <div class="search_bar_right ">
                    <button>
                        <div class="search_bar_think hovering" id="plus">
                            <i class="fa-solid fa-brain logo"></i>
                            Think
                        </div>
                    </button>

                    <button>
                        <div class="search_bar_mic hovering" id="plus">
                            <i class="fa-solid fa-microphone logo"></i>
                        </div>
                    </button>

                    <button>
                        <div class="waveform">
                            <i class="fa-brands fa-teamspeak" id="waveform"></i>
                        </div>
                    </button>

                </div>
            </div>

        </div>

    </div>

</body>

</html>
